# 443：Janus demo 页面 + 认证服务反代（合并站点）
# 证书使用 /etc/ccmeeting/tls/*，与客户端内置证书一致。

server {
    listen 443 ssl http2 default_server;
    server_name 8.153.155.18 8.159.150.173;

    ssl_certificate         /etc/ccmeeting/tls/cert.pem;
    ssl_certificate_key     /etc/ccmeeting/tls/key.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;

    # 头像上传是 base64 JSON
    client_max_body_size 8m;

    # ---------- 认证服务（FastAPI）----------
    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- Janus demo 页面 ----------
    location / {
        root /opt/janus/share/janus/html;
        index index.html index.htm;
    }

    # ---------- Janus HTTP/WS 代理（原有配置保留）----------
    location /janus {
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 信令服务 WSS（nginx stream 层 TLS 终止）
#
# 放置：/etc/nginx/nginx.conf 顶层（与 http {} 同级），或 conf.d 里用
#       include 到 stream {} 中。
#
# 注意：message_server 只监听 127.0.0.1:8889（明文），公网 8888 由这里做 TLS。
# 客户端：wss://<ip>:8888
#
# 生效：nginx -t && systemctl reload nginx

stream {
    server {
        listen 8888 ssl;
        ssl_certificate     /etc/ccmeeting/tls/cert.pem;
        ssl_certificate_key /etc/ccmeeting/tls/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_pass 127.0.0.1:8889;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}

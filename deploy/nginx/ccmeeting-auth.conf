# 认证服务 HTTPS（nginx 反代）
#
# 放置：/etc/nginx/conf.d/ccmeeting-auth.conf
# 证书：/etc/ccmeeting/tls/{cert.pem,key.pem}（自签 IP 证书或 Let's Encrypt）
# 后端：uvicorn 只监听 127.0.0.1:9000
#
# 生效：nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name _;                      # 纯 IP 部署；有域名时填域名

    ssl_certificate     /etc/ccmeeting/tls/cert.pem;
    ssl_certificate_key /etc/ccmeeting/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 头像上传是 base64 JSON，放宽请求体上限
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

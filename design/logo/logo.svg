<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
  </defs>

  <!-- 底板：圆角方形（22% 圆角，Windows/macOS 图标通用比例） -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>

  <!-- 主体：字母 C 兼镜头光圈，开口朝右 -->
  <path d="M 341 175 A 124 124 0 1 0 341 337"
        fill="none" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round"/>

  <!-- 镜头中心点 -->
  <circle cx="256" cy="256" r="34" fill="#FFFFFF"/>
</svg>